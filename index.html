      let waveTimer = 11.5;

      function spawnReinforcementWave(isInitial) {
        const count = isInitial ? 5 : 4;
        for (let i = 0; i < count; i++) {
          if (enemyBots.length >= 10) break;
          const spread = ((i / (count - 1 || 1)) - 0.5) * 0.95;
          spawnEnemyBot(spread, 240 + i * 38);
        }
        if (!isInitial) {
          playSoundEffect('alert');
          showRadioAlert(`BANDIT SQUADRON INBOUND (${enemyBots.length} ACTIVE)`);
        }
      }

      function updateBots(dt, elapsed) {
        // Prune destroyed bots
        for (let i = enemyBots.length - 1; i >= 0; i--) {
          if (!enemyBots[i].alive) {
            enemyBots.splice(i, 1);
          }
        }

        // Periodic reinforcement waves (faster if you clear the skies)
        waveTimer -= dt * (enemyBots.length === 0 ? 3.8 : 1.0);
        if (waveTimer <= 0) {
          waveTimer = 12.0;
          spawnReinforcementWave(false);
        }

        const playerForward = new THREE.Vector3(0, 0, -1).applyQuaternion(jetGroup.quaternion);

        for (let i = 0; i < enemyBots.length; i++) {
          const bot = enemyBots[i];
          bot.modeTimer -= dt;
          if (bot.modeTimer <= 0) {
            bot.maneuverMode = bot.maneuverMode === 'CROSS_IN_FRONT' ? 'ORBIT_CIRCLE' : 'CROSS_IN_FRONT';
            bot.modeTimer = 4.2 + Math.random() * 3.2;
          }

          // Cinematic clip-ready dogfight steering: bots deliberately weave & orbit ahead of the player's nose!
          const anchor = jetState.pos.clone().addScaledVector(playerForward, 165);
          let aimPoint;

          if (bot.maneuverMode === 'CROSS_IN_FRONT') {
            const sweep = Math.sin(elapsed * 1.15 + i * 1.7) * 95 * bot.orbitDir;
            const perpX = Math.cos(jetState.yaw) * sweep;
            const perpZ = -Math.sin(jetState.yaw) * sweep;
            aimPoint = new THREE.Vector3(
              anchor.x + perpX,
              Math.max(48, jetState.pos.y + Math.sin(elapsed * 0.9 + i) * 24),
              anchor.z + perpZ
            );
          } else {
            const orbitAngle = elapsed * 0.85 * bot.orbitDir + i * ((Math.PI * 2) / Math.max(1, enemyBots.length));
            const orbitRadius = 115;
            aimPoint = new THREE.Vector3(
              anchor.x + Math.cos(orbitAngle) * orbitRadius,
              Math.max(50, jetState.pos.y + Math.cos(elapsed * 0.7 + i) * 22),
              anchor.z + Math.sin(orbitAngle) * orbitRadius
            );
          }

          // If a bot drifts too far behind the player, smoothly vector it back across the player's front cone
          const relToPlayer = bot.pos.clone().sub(jetState.pos);
          if (relToPlayer.length() > 420 || relToPlayer.dot(playerForward) < -40) {
            aimPoint.copy(anchor);
          }

          const toAim = aimPoint.sub(bot.pos);
          const desiredYaw = Math.atan2(-toAim.x, -toAim.z);
          let yawDiff = desiredYaw - bot.yaw;
          while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
          while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;

          bot.yaw += Math.max(-1.65 * dt, Math.min(1.65 * dt, yawDiff * 2.2 * dt));

          const groundAhead = Math.max(0, getTerrainHeight(bot.pos.x, bot.pos.z));
          const safeY = Math.max(groundAhead + 32, aimPoint.y);
          const desiredPitch = Math.max(-0.42, Math.min(0.42, (safeY - bot.pos.y) * 0.014));
          bot.pitch += (desiredPitch - bot.pitch) * Math.min(1.0, dt * 3.0);

          const targetBank = Math.max(-1.05, Math.min(1.05, yawDiff * 1.4));
          bot.bank += (targetBank - bot.bank) * Math.min(1.0, dt * 4.2);

          _euler.set(bot.pitch, bot.yaw, bot.bank, 'YXZ');
          bot.group.quaternion.setFromEuler(_euler);

          const bForward = _v1.set(0, 0, -1).applyQuaternion(bot.group.quaternion);
          const bRight = _v2.set(1, 0, 0).applyQuaternion(bot.group.quaternion);

          bot.vel.copy(bForward).multiplyScalar(bot.speed);
          bot.pos.addScaledVector(bot.vel, dt);

          const minFloor = Math.max(12, getTerrainHeight(bot.pos.x, bot.pos.z) + 18);
          if (bot.pos.y < minFloor) {
            bot.pos.y = minFloor;
          }

          const flamePulse = 0.85 + Math.sin(elapsed * 36 + i) * 0.25;
          bot.leftFlame.scale.set(1, flamePulse, 1);
          bot.rightFlame.scale.set(1, flamePulse, 1);

          // Wingtip contrails & discrete dithered exhaust puffs
          const lTip = _v3.copy(bot.pos).addScaledVector(bRight, -4.1).addScaledVector(bForward, -0.4);
          const rTip = _v4.copy(bot.pos).addScaledVector(bRight,  4.1).addScaledVector(bForward, -0.4);
          updateRibbonTrail(bot.leftTrail, lTip, bRight, true);
          updateRibbonTrail(bot.rightTrail, rTip, bRight, true);

          bot.puffTimer -= dt;
          if (bot.puffTimer <= 0) {
            bot.puffTimer = 0.085;
            const exhaustPos = _v3.copy(bot.pos).addScaledVector(bForward, -4.2);
            spawnPuff(exhaustPos, _v4.set(0, 0.5, 0), 0.72, 2.2, 0.75, 'exhaust');
          }

          // Enemy tracer fire when loosely facing player
          bot.fireCooldown -= dt;
          if (bot.fireCooldown <= 0) {
            const toPlayer = jetState.pos.clone().sub(bot.pos);
            const dist = toPlayer.length();
            toPlayer.normalize();
            if (dist < 280 && bForward.dot(toPlayer) > 0.78) {
              bot.fireCooldown = 1.6 + Math.random() * 1.4;
              const bMesh = new THREE.Mesh(bulletGeo, botBulletMat);
              bMesh.position.copy(bot.pos).addScaledVector(bForward, 4.5);
              bMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), toPlayer);
              scene.add(bMesh);
              bullets.push({
                mesh: bMesh,
                vel: toPlayer.multiplyScalar(290),
                fromPlayer: false,
                life: 1.5
              });
            }
          }
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.life -= dt;
          b.mesh.position.addScaledVector(b.vel, dt);

          let hit = false;
          if (b.fromPlayer) {
            // Check enemy jets
            for (let j = 0; j < enemyBots.length; j++) {
              const bot = enemyBots[j];
              if (!bot.alive) continue;
              if (b.mesh.position.distanceToSquared(bot.pos) < 56) {
                bot.hp -= 12;
                triggerHitmarker();
                spawnPuff(b.mesh.position, new THREE.Vector3(0, 3, 0), 1.1, 3.0, 0.45, 'fire');
                if (bot.hp <= 0) {
                  destroyBot(bot);
                }
                hit = true;
                break;
              }
            }

            // Check destructible buildings & ships
            if (!hit) {
              for (let k = 0; k < activeBuildings.length; k++) {
                const bldg = activeBuildings[k];
                if (!bldg.alive) continue;
                if (
                  Math.abs(b.mesh.position.x - bldg.pos.x) < bldg.w * 0.72 + 2.5 &&
                  Math.abs(b.mesh.position.z - bldg.pos.z) < bldg.d * 0.72 + 2.5 &&
                  b.mesh.position.y >= bldg.groundY &&
                  b.mesh.position.y <= bldg.groundY + bldg.h + 3.0
                ) {
                  bldg.hp -= 10;
                  triggerHitmarker();
                  spawnPuff(b.mesh.position, new THREE.Vector3(0, 4, 0), 1.2, 3.4, 0.5, 'fire');
                  if (bldg.hp <= 0) {
                    destroyBuilding(bldg);
                  }
                  hit = true;
                  break;
                }
              }
            }
          } else {
            // Enemy bullet hitting player (automatically evaded while holding R to barrel roll!)
            const isRolling = jetState.rolling || Math.abs(jetState.rollAngle) > 0.12;
            if (!isRolling && b.mesh.position.distanceToSquared(jetState.pos) < 28) {
              damagePlayer(6);
              hit = true;
            }
          }

          if (hit || b.life <= 0 || b.mesh.position.y <= Math.max(0, getTerrainHeight(b.mesh.position.x, b.mesh.position.z))) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }
      }

      function updateMissiles(dt) {
        for (let i = missiles.length - 1; i >= 0; i--) {
          const m = missiles[i];
          m.life -= dt;

          if (m.target && m.target.alive) {
            const desired = m.target.pos.clone().sub(m.mesh.position).normalize().multiplyScalar(295);
            m.vel.lerp(desired, Math.min(1.0, dt * 6.5));
            m.vel.normalize().multiplyScalar(295);
          }

          m.mesh.position.addScaledVector(m.vel, dt);
          const dir = _v1.copy(m.vel).normalize();
          m.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir);

          m.puffTimer -= dt;
          if (m.puffTimer <= 0) {
            m.puffTimer = 0.032;
            spawnPuff(m.mesh.position, _v2.set(0, 0.4, 0), 0.75, 2.4, 0.65, 'exhaust');
          }

          let detonated = false;
          for (let j = 0; j < enemyBots.length; j++) {
            const bot = enemyBots[j];
            if (!bot.alive) continue;
            if (m.mesh.position.distanceToSquared(bot.pos) < 110) {
              destroyBot(bot);
              detonated = true;
              break;
            }
          }

          if (!detonated) {
            for (let k = 0; k < activeBuildings.length; k++) {
              const bldg = activeBuildings[k];
              if (!bldg.alive) continue;
              if (
                Math.abs(m.mesh.position.x - bldg.pos.x) < bldg.w * 0.8 + 4.0 &&
                Math.abs(m.mesh.position.z - bldg.pos.z) < bldg.d * 0.8 + 4.0 &&
                m.mesh.position.y >= bldg.groundY - 1.0 &&
                m.mesh.position.y <= bldg.groundY + bldg.h + 5.0
              ) {
                destroyBuilding(bldg);
                detonated = true;
                break;
              }
            }
          }

          const groundY = Math.max(0, getTerrainHeight(m.mesh.position.x, m.mesh.position.z));
          if (!detonated && m.mesh.position.y <= groundY) {
            spawnShockwave(m.mesh.position, 22, 0xffb347);
            playSoundEffect('explosion');
            detonated = true;
          }

          if (detonated || m.life <= 0) {
            scene.remove(m.mesh);
            missiles.splice(i, 1);
          }
        }
      }

      function updateTargetingHUD() {
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(jetGroup.quaternion);
        let bestTarget = null;
        let bestType = null;
        let bestScore = -1;
        let nearestOffscreenBot = null;
        let nearestBotDist = Infinity;

        for (let i = 0; i < enemyBots.length; i++) {
          const bot = enemyBots[i];
          if (!bot.alive) continue;
          const toBot = bot.pos.clone().sub(jetState.pos);
          const dist = toBot.length();
          if (dist < nearestBotDist) {
            nearestBotDist = dist;
            nearestOffscreenBot = bot;
          }
          if (dist < 560) {
            const dot = forward.dot(toBot.normalize());
            if (dot > 0.84) {
              const score = dot * 100 - dist * 0.05;
              if (score > bestScore) {
                bestScore = score;
                bestTarget = bot;
                bestType = 'bot';
              }
            }
          }
        }

        if (!bestTarget) {
          for (let i = 0; i < activeBuildings.length; i++) {
            const bldg = activeBuildings[i];
            if (!bldg.alive) continue;
            const toBldg = bldg.pos.clone().sub(jetState.pos);
            const dist = toBldg.length();
            if (dist < 460) {
              const dot = forward.dot(toBldg.normalize());
              if (dot > 0.89) {
                const score = dot * 85 - dist * 0.05;
                if (score > bestScore) {
                  bestScore = score;
                  bestTarget = bldg;
                  bestType = 'bldg';
                }
              }
            }
          }
        }

        lockedTarget = bestTarget;
        lockedTargetType = bestType;

        const w = window.innerWidth;
        const h = window.innerHeight;

        if (lockedTarget) {
          const proj = lockedTarget.pos.clone().project(camera);
          if (proj.z < 1) {
            const sx = (proj.x * 0.5 + 0.5) * w;
            const sy = (-proj.y * 0.5 + 0.5) * h;
            targetLockEl.classList.add('locked');
            targetLockEl.style.left = `${sx}px`;
            targetLockEl.style.top = `${sy}px`;
            targetLockLabelEl.textContent = lockedTargetType === 'bot' ? 'LOCK' : 'CITY';
          } else {
            targetLockEl.classList.remove('locked');
          }

          if (lockedTargetType === 'bot') {
            const dist = lockedTarget.pos.distanceTo(jetState.pos);
            const leadPos = lockedTarget.pos.clone().addScaledVector(lockedTarget.vel, dist / 460);
            const lProj = leadPos.project(camera);
            if (lProj.z < 1) {
              leadReticleEl.style.display = 'block';
              leadReticleEl.style.left = `${(lProj.x * 0.5 + 0.5) * w}px`;
              leadReticleEl.style.top = `${(-lProj.y * 0.5 + 0.5) * h}px`;
            } else {
              leadReticleEl.style.display = 'none';
            }
          } else {
            leadReticleEl.style.display = 'none';
          }
        } else {
          targetLockEl.classList.remove('locked');
          leadReticleEl.style.display = 'none';
        }

        // Off-screen directional indicator for nearest bandit
        if (nearestOffscreenBot) {
          const proj = nearestOffscreenBot.pos.clone().project(camera);
          const onScreen = proj.z < 1 && Math.abs(proj.x) <= 0.92 && Math.abs(proj.y) <= 0.92;
          if (!onScreen) {
            let dx = proj.x;
            let dy = -proj.y;
            if (proj.z > 1) {
              dx = -dx;
              dy = -dy;
            }
            const angle = Math.atan2(dy, dx);
            const rx = Math.cos(angle) * (w * 0.43);
            const ry = Math.sin(angle) * (h * 0.41);
            offscreenEl.style.display = 'block';
            offscreenEl.style.left = `${w * 0.5 + rx}px`;
            offscreenEl.style.top = `${h * 0.5 + ry}px`;
            offscreenEl.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI * 0.5}rad)`;
          } else {
            offscreenEl.style.display = 'none';
          }
        } else {
          offscreenEl.style.display = 'none';
        }
      }

          container.style.cursor = 'none';
          if (cursorLockLabelEl) cursorLockLabelEl.textContent = 'UNLOCK CURSOR';
        } else if (isCursorLocked) {
          unlockCursor();
        }
      });

      function toggleCockpit() {
        jetState.cockpitView = !jetState.cockpitView;
        jetGroup.visible = !jetState.cockpitView;
        cockpitHudEl.classList.toggle('active', jetState.cockpitView);
      }

      // Supports both center-locked relative steering AND unlocked Chromebook trackpad hover steering!
      window.addEventListener('mousemove', (e) => {
        if (isCursorLocked) {
          const sensitivity = 0.0028;
          const dx = e.movementX || 0;
          const dy = e.movementY || 0;
          steerInput.x = Math.max(-1, Math.min(1, steerInput.x + dx * sensitivity));
          steerInput.y = Math.max(-1, Math.min(1, steerInput.y + dy * sensitivity));
          updateReticleVisual();
        } else {
          const nx = (e.clientX / window.innerWidth) * 2 - 1;
          const ny = (e.clientY / window.innerHeight) * 2 - 1;
          steerInput.x = Math.max(-1, Math.min(1, nx * 1.15));
          steerInput.y = Math.max(-1, Math.min(1, ny * 1.15));
          updateReticleVisual(e.clientX, e.clientY);
        }
      });

      container.addEventListener('mousedown', (e) => {
        initAudio();
        if (e.button === 0) {
          jetState.firingGuns = true;
          firePlayerAutocannon(true);
        } else if (e.button === 2) {
          fireMissile();
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          jetState.firingGuns = false;
        }
      });

      container.addEventListener('contextmenu', (e) => e.preventDefault());

      window.addEventListener('keydown', (e) => {
        initAudio();
        keysPressed[e.code] = true;
        if (e.code === 'KeyL') {
          e.preventDefault();
          toggleCursorLock();
        } else if (e.code === 'Space' || e.code === 'KeyV') {
          e.preventDefault();
          toggleCockpit();
        } else if (e.code === 'KeyF' || e.code === 'KeyE') {
          e.preventDefault();
          fireMissile();
        } else if ((e.code === 'KeyC' || e.code === 'Enter') && !e.repeat) {
          firePlayerAutocannon(true);
        } else if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
          e.preventDefault();
        }
      });

      window.addEventListener('keyup', (e) => {
        keysPressed[e.code] = false;
      });

      // Touch Controls
      container.addEventListener('touchstart', (e) => {
        initAudio();
        if (e.target.closest('button')) return;
        const t = e.changedTouches[0];
        activeTouchId = t.identifier;
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === activeTouchId) {
            const nx = (t.clientX / window.innerWidth) * 2 - 1;
            const ny = (t.clientY / window.innerHeight) * 2 - 1;
            steerInput.x = Math.max(-1, Math.min(1, nx * 1.3));
            steerInput.y = Math.max(-1, Math.min(1, ny * 1.3));
            updateReticleVisual(t.clientX, t.clientY);
          }
        }
      }, { passive: true });

      container.addEventListener('touchend', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === activeTouchId) {
            activeTouchId = null;
            steerInput.x = 0;
            steerInput.y = 0;
          }
        }
      }, { passive: true });

      const btnFire = document.getElementById('btn-fire');
      const btnMissile = document.getElementById('btn-missile');
      const btnRoll = document.getElementById('btn-roll');
      const btnBoost = document.getElementById('btn-boost');
      const btnCam = document.getElementById('btn-cam');

      btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); jetState.firingGuns = true; firePlayerAutocannon(true); });
      btnFire.addEventListener('touchend', (e) => { e.preventDefault(); jetState.firingGuns = false; });
      btnMissile.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); fireMissile(); });
      btnRoll.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); keysPressed['KeyR'] = true; });
      btnRoll.addEventListener('touchend', (e) => { e.preventDefault(); keysPressed['KeyR'] = false; });
      btnBoost.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); keysPressed['ShiftLeft'] = true; });
      btnBoost.addEventListener('touchend', (e) => { e.preventDefault(); keysPressed['ShiftLeft'] = false; });
      btnCam.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); toggleCockpit(); });

      function updateFlight(dt) {
        if (radioAlertTimer > 0) {
          radioAlertTimer -= dt;
          if (radioAlertTimer <= 0) {
            radioAlertEl.style.opacity = '0';
            radioAlertEl.style.transform = 'translate(-50%, -8px)';
          }
        }

        // Reload missiles smoothly
        for (let i = missileReloadTimers.length - 1; i >= 0; i--) {
          missileReloadTimers[i] -= dt;
          if (missileReloadTimers[i] <= 0) {
            missileReloadTimers.splice(i, 1);
            missileAmmo = Math.min(MAX_MISSILES, missileAmmo + 1);
            updateMissileHUD();
          }
        }

        jetState.boosting = !!(keysPressed['ShiftLeft'] || keysPressed['ShiftRight'] || keysPressed['KeyW']);
        const targetSpeed = jetState.boosting ? jetState.boostSpeed : jetState.baseSpeed;
        jetState.speed += (targetSpeed - jetState.speed) * Math.min(1.0, dt * 3.8);

        // Dynamic FOV speed surge
        const targetFov = jetState.boosting ? 63 : 56;
        if (Math.abs(camera.fov - targetFov) > 0.05) {
          camera.fov += (targetFov - camera.fov) * Math.min(1.0, dt * 4.5);
          camera.updateProjectionMatrix();
        }

        // Gentle virtual stick auto-centering when cursor is center-locked
        if (isCursorLocked && activeTouchId === null) {
          const returnDamping = Math.pow(0.24, dt);
          steerInput.x *= returnDamping;
          steerInput.y *= returnDamping;
          if (Math.abs(steerInput.x) < 0.002) steerInput.x = 0;
          if (Math.abs(steerInput.y) < 0.002) steerInput.y = 0;
          updateReticleVisual();
        }

        let inX = steerInput.x;
        let inY = steerInput.y;
        if (keysPressed['ArrowLeft'] || keysPressed['KeyA']) inX -= 0.85;
        if (keysPressed['ArrowRight'] || keysPressed['KeyD']) inX += 0.85;
        if (keysPressed['ArrowUp']) inY -= 0.85;
        if (keysPressed['ArrowDown'] || keysPressed['KeyS']) inY += 0.85;
        inX = Math.max(-1, Math.min(1, inX));
        inY = Math.max(-1, Math.min(1, inY));

        const deadZone = isCursorLocked ? 0.04 : 0.07;
        const effX = Math.abs(inX) < deadZone ? 0 : (inX - Math.sign(inX) * deadZone) / (1 - deadZone);
        const effY = Math.abs(inY) < deadZone ? 0 : (inY - Math.sign(inY) * deadZone) / (1 - deadZone);

        jetState.yaw -= effX * 1.42 * dt;
        const targetPitch = -effY * 0.72;
        jetState.pitch += (targetPitch - jetState.pitch) * Math.min(1.0, dt * 4.6);

        const targetBank = -effX * 0.88;
        jetState.bank += (targetBank - jetState.bank) * Math.min(1.0, dt * 5.2);

        // Hold R to barrel roll continuously; release R to smoothly finish rotation
        jetState.rolling = !!keysPressed['KeyR'];
        if (jetState.rollSoundCooldown > 0) jetState.rollSoundCooldown -= dt;

        if (jetState.rolling) {
          jetState.rollAngle += dt * 7.8;
          if (jetState.rollSoundCooldown <= 0) {
            playSoundEffect('roll');
            jetState.rollSoundCooldown = 0.45;
          }
          if (jetState.rollAngle >= Math.PI * 2) {
            jetState.rollAngle -= Math.PI * 2;
          }
        } else if (jetState.rollAngle > 0.001) {
          if (jetState.rollAngle < Math.PI) {
            jetState.rollAngle = Math.max(0, jetState.rollAngle - dt * 7.2);
          } else {
            jetState.rollAngle += dt * 7.2;
            if (jetState.rollAngle >= Math.PI * 2) {
              jetState.rollAngle = 0;
            }
          }
        }

        _euler.set(jetState.pitch, jetState.yaw, jetState.bank + jetState.rollAngle, 'YXZ');
        jetGroup.quaternion.setFromEuler(_euler);

        const forward = _v1.set(0, 0, -1).applyQuaternion(jetGroup.quaternion);
        const right = _v2.set(1, 0, 0).applyQuaternion(jetGroup.quaternion);

        jetState.pos.addScaledVector(forward, jetState.speed * dt);

        // Smooth terrain & water clearance floor
        const terrainY = Math.max(0, getTerrainHeight(jetState.pos.x, jetState.pos.z));
        const minSafeAlt = terrainY + 9.5;
        if (jetState.pos.y < minSafeAlt) {
          jetState.pos.y = minSafeAlt;
          if (jetState.pitch < 0) jetState.pitch *= 0.6;
        }
        if (jetState.pos.y > 420) {
          jetState.pos.y = 420;
        }

        jetGroup.position.copy(jetState.pos);

        // Animate stabilators
        if (playerBuilt.surfaces) {
          playerBuilt.surfaces.lHStab.rotation.x = effY * 0.28;
          playerBuilt.surfaces.rHStab.rotation.x = effY * 0.28;
        }

        // Twin autocannon firing
        if (gunCooldown > 0) {
          gunCooldown = Math.max(0, gunCooldown - dt);
        }
        if (jetState.firingGuns || keysPressed['KeyC'] || keysPressed['Enter']) {
          firePlayerAutocannon();
        }

        // Animate twin golden-orange afterburners & rhythmic Bayer-dithered smoke spheres (IMG_1165.PNG)
        const boostScale = jetState.boosting ? 1.55 : 0.92;
        const flicker = 0.88 + Math.random() * 0.28;
        playerBuilt.leftFlame.scale.set(jetState.boosting ? 1.2 : 0.9, boostScale * flicker, jetState.boosting ? 1.2 : 0.9);
        playerBuilt.rightFlame.scale.set(jetState.boosting ? 1.2 : 0.9, boostScale * flicker, jetState.boosting ? 1.2 : 0.9);

        jetState.puffTimer -= dt;
        const puffInterval = jetState.boosting ? 0.045 : 0.068;
        if (jetState.puffTimer <= 0) {
          jetState.puffTimer = puffInterval;
          const tailL = _v3.copy(jetState.pos).addScaledVector(forward, -4.4).addScaledVector(right, -0.42);
          const tailR = _v4.copy(jetState.pos).addScaledVector(forward, -4.4).addScaledVector(right,  0.42);
          const drift = new THREE.Vector3(0, 0.35, 0);
          spawnPuff(tailL, drift, jetState.boosting ? 0.95 : 0.72, jetState.boosting ? 2.7 : 2.1, 0.85, 'exhaust');
          spawnPuff(tailR, drift, jetState.boosting ? 0.95 : 0.72, jetState.boosting ? 2.7 : 2.1, 0.85, 'exhaust');
        }

        // Wingtip contrail ribbons
        const wingL = _v3.copy(jetState.pos).addScaledVector(right, -4.3).addScaledVector(forward, -1.2);
        const wingR = _v4.copy(jetState.pos).addScaledVector(right,  4.3).addScaledVector(forward, -1.2);
        updateRibbonTrail(leftTrail, wingL, right, true);
        updateRibbonTrail(rightTrail, wingR, right, true);

        // Dynamic Web Audio turbine & airflow modulation
        if (audioInitialized && audioCtx) {
          const speedRatio = (jetState.speed - jetState.baseSpeed) / (jetState.boostSpeed - jetState.baseSpeed);
          const now = audioCtx.currentTime;
          engineOsc1.frequency.setTargetAtTime(108 + speedRatio * 58, now, 0.08);
          engineOsc2.frequency.setTargetAtTime(54 + speedRatio * 29, now, 0.08);
          engineNoiseFilter.frequency.setTargetAtTime(260 + speedRatio * 480, now, 0.08);
          engineNoiseGain.gain.setTargetAtTime(0.15 + speedRatio * 0.14, now, 0.08);
        }

        // Camera tracking (3rd-Person Chase vs 1st-Person Cockpit)
        if (jetState.cockpitView) {
          const eyePos = _v3.copy(jetState.pos)
            .addScaledVector(forward, 1.45)
            .add(new THREE.Vector3(0, 0.56, 0).applyQuaternion(jetGroup.quaternion));
          camera.position.copy(eyePos);
          camera.quaternion.copy(jetGroup.quaternion);
          hudSpdEl.textContent = `SPD ${Math.round(jetState.speed * 4.2)} KT`;
          hudAltEl.textContent = `ALT ${Math.round(jetState.pos.y * 22)} FT`;
        } else {
          const chaseBack = _v3.set(0, 0, 1).applyEuler(new THREE.Euler(jetState.pitch * 0.45, jetState.yaw, 0, 'YXZ'));
          const desiredCam = _v4.copy(jetState.pos)
            .addScaledVector(chaseBack, 17.5)
            .add(new THREE.Vector3(0, 4.8, 0));

          if (screenShake > 0) {
            desiredCam.x += (Math.random() - 0.5) * screenShake * 2.2;
            desiredCam.y += (Math.random() - 0.5) * screenShake * 2.2;
            screenShake = Math.max(0, screenShake - dt * 2.4);
          }

          camera.position.lerp(desiredCam, Math.min(1.0, dt * 11.5));
          const lookTarget = _v3.copy(jetState.pos).addScaledVector(forward, 22).add(new THREE.Vector3(0, 1.2, 0));
          camera.lookAt(lookTarget);
        }

        // Keep sky, ocean & sun anchored to player for seamless infinite flight
        skyDome.position.copy(jetState.pos);
        waterPlane.position.set(jetState.pos.x, 0, jetState.pos.z);
        waterMat.uniforms.uJetPos.value.copy(jetState.pos);
        sunLight.position.set(jetState.pos.x + 420, 310, jetState.pos.z - 540);

        updateTerrainGrid(jetState.pos.x, jetState.pos.z);
      }

      // -----------------------------------------------------------------------
      // 11. WINDOW RESIZE, ADAPTIVE CHROMEBOOK FPS SCALER & ANIMATION LOOP
      // -----------------------------------------------------------------------
      function resizeRenderTarget() {
        rtWidth = Math.max(360, Math.floor(window.innerWidth / pixelScale));
        rtHeight = Math.max(202, Math.floor(window.innerHeight / pixelScale));
        renderTarget.setSize(rtWidth, rtHeight);
        ditherMaterial.uniforms.uResolution.value.set(rtWidth, rtHeight);
      }

      window.addEventListener('resize', () => {
        const w = window.innerWidth;
        const h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        resizeRenderTarget();
      });

      let lastTime = performance.now();
      let elapsed = 0;
      let fpsSampleFrames = 0;
      let fpsSampleTime = 0;

      function animate(now) {
        requestAnimationFrame(animate);

        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
        lastTime = now;
        elapsed += dt;

        // Automatic resolution scaling so Chromebooks maintain smooth 60 FPS without lag
        fpsSampleFrames++;
        fpsSampleTime += dt;
        if (fpsSampleTime >= 1.5) {
          const avgFps = fpsSampleFrames / fpsSampleTime;
          if (avgFps < 46 && pixelScale < 3.4) {
            pixelScale = Math.min(3.4, pixelScale + 0.45);
            resizeRenderTarget();
          } else if (avgFps > 57 && pixelScale > 2.2) {
            pixelScale = Math.max(2.2, pixelScale - 0.25);
            resizeRenderTarget();
          }
          fpsSampleFrames = 0;
          fpsSampleTime = 0;
        }

        skyMat.uniforms.uTime.value = elapsed;
        waterMat.uniforms.uTime.value = elapsed;

        updateFlight(dt);
        updateBots(dt, elapsed);
        updateBullets(dt);
        updateMissiles(dt);
        updatePuffs(dt);
        updateVoxels(dt);
        updateShockwaves(dt);
        updateTargetingHUD();

        renderer.setRenderTarget(renderTarget);
        renderer.clear(true, true, true);
        renderer.render(scene, camera);

        renderer.setRenderTarget(null);
        renderer.clear(true, true, true);
        renderer.render(postScene, postCamera);
      }

      updateTerrainGrid(jetState.pos.x, jetState.pos.z);
      updateMissileHUD();
      spawnReinforcementWave(true);
      requestAnimationFrame(animate);
    })();
  </script>
